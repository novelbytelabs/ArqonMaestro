site_name: Arqon Maestro Docs
site_description: Voice-first control layer documentation for the Arqon ecosystem
site_url: https://novelbytelabs.github.io/ArqonMaestro/
repo_url: https://github.com/novelbytelabs/ArqonMaestro/
repo_name: novelbytelabs/ArqonMaestro
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:8079

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Decision Log: decision-log.md
  - Modernization Matrix: modernization-matrix.md

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

plugins:
  - search
  - git-revision-date-localized:
      enabled: true
      type: date
      locale: en
      fallback_to_build_date: true
      enable_parallel_processing: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelbytelabs/ArqonMaestro

copyright: Copyright &copy; 2026 NovelByte Labs
