site_name: Arqon Maestro Docs
site_description: Voice-first control layer documentation for the Arqon ecosystem
site_url: https://novelbytelabs.github.io/ArqonMaestro/
repo_url: https://github.com/novelbytelabs/ArqonMaestro/
repo_name: novelbytelabs/ArqonMaestro
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:8089

theme:
  name: "material"
  custom_dir: overrides
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  features:
    #    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - toc.follow
    - content.tabs.link
    - content.code.annotate
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - navigation.instant
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to Light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to Dark mode
  icon:
    repo: fontawesome/brands/github


nav:
  - Overview: index.md
  - Ecosystem:
      - Maestro In Arqon: overview/ecosystem.md
      - Arqon Ecosystem Technotes: overview/arqon-ecosystem-technotes.md
  - Decision Log: decision-log.md
  - Modernization Matrix: modernization-matrix.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - How Commands Work: guides/how-commands-work.md
      - Common Commands: guides/common-commands.md
      - Adding and Inserting Code: guides/adding-and-inserting-code.md
      - Navigation and Selection: guides/navigation-and-selection.md
      - Editing and Refactoring: guides/editing-and-refactoring.md
      - Dictation and Raw Text: guides/dictation-and-raw-text.md
      - Command Modes: guides/command-modes.md
      - Revision Box and Text Input: guides/revision-box-and-text-input.md
      - Alternatives and Corrections: guides/alternatives-and-corrections.md
      - Application Control: guides/application-control.md
      - Browser and System Control: guides/browser-and-system-control.md
      - Editor Integrations: guides/editor-integrations.md
      - In-App Tutorials: guides/in-app-tutorials.md
      - Building: guides/building.md
  - Browser:
      - Getting Started: browser/getting-started.md
      - Navigation: browser/navigation.md
      - Links and Inputs: browser/links-and-inputs.md
      - Editing Text and Code: browser/editing-text-and-code.md
  - Architecture:
      - Codebase Layout: architecture/codebase-layout.md
      - Request Lifecycle: architecture/request-lifecycle.md
      - Maestro Actuation And Control Stack: architecture/maestro-actuation-and-control-stack.md
      - Ultimate VOS Reference Architecture: architecture/ultimate-vos-reference-architecture.md
  - Policies:
      - Chrome Extension Privacy Policy: privacy-policy/maestro-chrome-extension/index.md
  - Models:
      - Generating Data: models/generating-data.md
      - Model Architecture: models/model-architecture.md
      - Training Models: models/training-models.md
  - Operations:
      - Port Reference: operations/port-reference.md
      - Gate 6 Kokoro Plan: operations/gate-6-kokoro-plan.md
      - Configuration: operations/configuration.md
      - Gotcha Registry: operations/gotcha-registry.md
      - Rebrand Program: operations/rebrand-program.md
      - External Infrastructure Ownership: operations/external-infrastructure-ownership.md
      - Frozen Requirements Registry: operations/frozen-requirements-registry.md
      - Historical and Provenance Audit: operations/historical-provenance-audit.md
      - Troubleshooting Map: operations/troubleshooting-map.md
  - Development:
      - Extending Maestro: development/extending-maestro.md
      - Codex UI/UX Workflow: development/codex-ui-ux-workflow.md
      - Custom Commands: development/custom-commands.md
      - Snippets: development/snippets.md
      - API Reference: development/api-reference.md
      - Protocol Overview: development/protocol-overview.md
      - Protocol Messages: development/protocol-messages.md
      - Plugin Lifecycle: development/plugin-lifecycle.md
  - Parsing:
      - Grammars: parsing/grammars.md
  - Testing:
      - Focus Test Plan: vos/maestro-focus-test-plan.md
  - Runtime Services (FP-2A/2B):
      - Identity Gateway: vos/maestro-identity-gateway-service.md
      - Authorization Service: vos/maestro-authorization-service.md
      - Workflow Contract: vos/maestro-workflow-contract-service.md
  - Reference:
      - Selectors: reference/selectors.md
      - Formatting and Symbols: reference/formatting-and-symbols.md

markdown_extensions:
  - attr_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - def_list
  - pymdownx.snippets
  - pymdownx.progressbar
  - pymdownx.magiclink
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/theme.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Custom CSS file for additional styling
extra_css:
  - stylesheets/extra.css

# This tells mkdocs where your documentation source files are
docs_dir: "docs"

# This allows GitHub Actions to deploy the site to the gh-pages branch
edit_uri: edit/main/docs/

# Additional configuration
# plugins:
#   - search:
#       separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.|'

# Extra configuration
extra:
  version: "0.2.0-alpha.1 (planned)"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelbytelabs/arqonbus
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/arqoncloud
  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/novelbytelabs/arqonbus/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">telling us what you found helpful or what could be improved</a>.

copyright: "Copyright &copy; 2026 NovelByte Labs - All rights reserved."

plugins:
  - search:
  - minify:
      minify_html: true
