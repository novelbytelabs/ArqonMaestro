plugins {
    id "base"
}

def requiredNativeInputs = [
    [label: "Boost 1.78 install", path: "${rootProject.libraryRoot}/boost"],
    [label: "Protobuf root", path: "${rootProject.protobufRoot}/include/google/protobuf"],
    [label: "Protobuf compiler", path: "${rootProject.protobufCompiler}"],
    [label: "Protobuf library", path: "${rootProject.protobufLibrary}"],
    [label: "Crow headers", path: "${rootProject.libraryRoot}/crow/include"],
    [label: "Kaldi source tree", path: "${rootProject.libraryRoot}/kaldi/src"],
    [label: "Speech-engine proto", path: "${rootProject.projectDir}/toolbelt/src/main/proto/speech-engine.proto"],
]

task verifyNativeInputs {
    doLast {
        def missing = requiredNativeInputs.findAll { !file(it.path).exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Missing native dependencies for speech-engine packaging:\n - " +
                missing.collect { "${it.label}: ${it.path}" }.join("\n - ") +
                "\nInstall the native dependency stack with maestro/scripts/setup/build-dependencies.sh and rerun ./gradlew client:installServer -x downloadModels."
            )
        }
    }
}

task buildCMake(type: Exec, dependsOn: [rootProject.downloadModels, verifyNativeInputs]) {
    environment "ARQON_MAESTRO_SOURCE_ROOT", rootProject.projectDir.absolutePath
    environment "SERENADE_SOURCE_ROOT", rootProject.projectDir.absolutePath
    environment "ARQON_MAESTRO_LIBRARY_ROOT", rootProject.libraryRoot
    environment "SERENADE_LIBRARY_ROOT", rootProject.libraryRoot
    environment "ARQON_MAESTRO_PROTOBUF_ROOT", rootProject.protobufRoot
    environment "SERENADE_PROTOBUF_ROOT", rootProject.protobufRoot
    environment "ARQON_MAESTRO_PROTOC_EXECUTABLE", rootProject.protobufCompiler
    environment "SERENADE_PROTOC_EXECUTABLE", rootProject.protobufCompiler
    environment "ARQON_MAESTRO_LINEAR_ALGEBRA_BACKEND", rootProject.linearAlgebraBackend
    environment "SERENADE_LINEAR_ALGEBRA_BACKEND", rootProject.linearAlgebraBackend
    environment "ARQON_MAESTRO_MKL_ROOT", rootProject.mklRoot
    environment "SERENADE_MKL_ROOT", rootProject.mklRoot
    environment "ARQON_MAESTRO_OPENBLAS_LIBRARY", rootProject.openBlasLibrary
    environment "SERENADE_OPENBLAS_LIBRARY", rootProject.openBlasLibrary
    commandLine "bash", "-c", "mkdir -p server/build && cd server/build && cmake .. && cmake --build . -j2"
}

task distTar(type: Tar, dependsOn: [buildCMake]) {
    archiveExtension = "tar.gz"
    compression = Compression.GZIP

    from("bin/run-pro", "server/build/speech-engine/arqon-maestro-speech-engine")
    into "speech-engine"
}

task packageModels(type: Tar, dependsOn: [rootProject.downloadModels]) {
    archiveBaseName = "speech-engine-models"
    archiveExtension = "tar.gz"
    compression = Compression.GZIP

    from rootProject.speechEngineModels
    exclude "acoustic-model/**", "user-language-model/**"
    into "speech-engine-models"
}

task installDist(dependsOn: [buildCMake]) {}

build {
    dependsOn buildCMake
}

clean {
    delete "build"
    delete "server/build"
}
