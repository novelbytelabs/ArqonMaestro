def daggerVersion = "2.51.1"
def jettyVersion = "9.4.53.v20231009"
def jupiterVersion = "5.10.2"
def logbackVersion = "1.4.14"
def protobufVersion = "3.25.2"
def slf4jVersion = "2.0.13"
def guavaVersion = "33.0.0-jre"

project.ext.antlrRuntime = "org.antlr:antlr4-runtime:4.7"
project.ext.jettyServer = "org.eclipse.jetty:jetty-server:$jettyVersion"
project.ext.jettyWebsocketServer = "org.eclipse.jetty.websocket:javax-websocket-server-impl:$jettyVersion"
project.ext.protobufVersion = protobufVersion
project.ext.s3 = "com.amazonaws:aws-java-sdk-s3:1.11.313"
project.ext.websocketApi = "javax.websocket:javax.websocket-api:1.1"

def sourceRoot = project.ext.sourceRoot = (
    System.env.ARQON_MAESTRO_SOURCE_ROOT != null ?
        System.env.ARQON_MAESTRO_SOURCE_ROOT :
        (
            System.env.SERENADE_SOURCE_ROOT != null ?
                System.env.SERENADE_SOURCE_ROOT :
                rootProject.projectDir.absolutePath
        )
)

def libraryRoot = project.ext.libraryRoot = (
    System.env.ARQON_MAESTRO_LIBRARY_ROOT != null ?
        System.env.ARQON_MAESTRO_LIBRARY_ROOT :
        (
            System.env.SERENADE_LIBRARY_ROOT != null ?
                System.env.SERENADE_LIBRARY_ROOT :
                (
                    new File(System.properties["user.home"] + "/libarqon").exists() ?
                        System.properties["user.home"] + "/libarqon" :
                        System.properties["user.home"] + "/libserenade"
                )
        )
)

def defaultFrozenCondaRoot = "${System.properties['user.home']}/miniconda3/envs/helios-gpu-118"
def protobufRoot = project.ext.protobufRoot = (
    System.env.ARQON_MAESTRO_PROTOBUF_ROOT != null ?
        System.env.ARQON_MAESTRO_PROTOBUF_ROOT :
        (
            System.env.SERENADE_PROTOBUF_ROOT != null ?
                System.env.SERENADE_PROTOBUF_ROOT :
                (
                    System.env.CONDA_PREFIX != null &&
                    new File("${System.env.CONDA_PREFIX}/include/google/protobuf").exists() &&
                    (
                        new File("${System.env.CONDA_PREFIX}/lib/libprotobuf.a").exists() ||
                        new File("${System.env.CONDA_PREFIX}/lib/libprotobuf.so").exists()
                    ) ?
                        System.env.CONDA_PREFIX :
                        (
                            new File("${defaultFrozenCondaRoot}/include/google/protobuf").exists() &&
                            (
                                new File("${defaultFrozenCondaRoot}/lib/libprotobuf.a").exists() ||
                                new File("${defaultFrozenCondaRoot}/lib/libprotobuf.so").exists()
                            ) ?
                                defaultFrozenCondaRoot :
                                "$libraryRoot/protobuf"
                        )
                )
        )
)

def protobufCompiler = project.ext.protobufCompiler = (
    System.env.ARQON_MAESTRO_PROTOC_EXECUTABLE != null ?
        System.env.ARQON_MAESTRO_PROTOC_EXECUTABLE :
        (
            System.env.SERENADE_PROTOC_EXECUTABLE != null ?
                System.env.SERENADE_PROTOC_EXECUTABLE :
                (
                    new File("${protobufRoot}/bin/protoc").exists() ?
                        "${protobufRoot}/bin/protoc" :
                        (
                            new File("${System.properties['user.home']}/.local/bin/protoc").exists() ?
                                "${System.properties['user.home']}/.local/bin/protoc" :
                                "protoc"
                        )
                )
        )
)

def protobufLibrary = project.ext.protobufLibrary = (
    new File("${protobufRoot}/lib/libprotobuf.a").exists() ?
        "${protobufRoot}/lib/libprotobuf.a" :
        (
            new File("${protobufRoot}/lib/libprotobuf.so").exists() ?
                "${protobufRoot}/lib/libprotobuf.so" :
                "${protobufRoot}/lib/libprotobuf.so.29.3.0"
        )
)

def mklRoot = project.ext.mklRoot = (
    System.env.ARQON_MAESTRO_MKL_ROOT != null ?
        System.env.ARQON_MAESTRO_MKL_ROOT :
        (
            System.env.SERENADE_MKL_ROOT != null ?
                System.env.SERENADE_MKL_ROOT :
                "/opt/intel/mkl"
        )
)

def openBlasLibrary = project.ext.openBlasLibrary = (
    System.env.ARQON_MAESTRO_OPENBLAS_LIBRARY != null ?
        System.env.ARQON_MAESTRO_OPENBLAS_LIBRARY :
        (
            System.env.SERENADE_OPENBLAS_LIBRARY != null ?
                System.env.SERENADE_OPENBLAS_LIBRARY :
                (
                    new File("/usr/lib/x86_64-linux-gnu/libopenblas.so").exists() ?
                        "/usr/lib/x86_64-linux-gnu/libopenblas.so" :
                        "libopenblas.so"
                )
        )
)

def linearAlgebraBackend = project.ext.linearAlgebraBackend = (
    new File("${mklRoot}/lib/intel64/libmkl_core.a").exists() ? "MKL" : "OPENBLAS"
)

project.ext.codeEngineModels = "$libraryRoot/models/code-engine"
project.ext.speechEngineModels = "$libraryRoot/models/speech-engine"

subprojects {
    apply plugin: "java"

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    plugins.withType(DistributionPlugin) {
        distTar {
            archiveExtension = "tar.gz"
            compression = Compression.GZIP
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url "https://jitpack.io"
        }
    }

    dependencies {
        implementation "ch.qos.logback:logback-core:$logbackVersion"
        implementation "ch.qos.logback:logback-classic:$logbackVersion"
        implementation "com.google.dagger:dagger:$daggerVersion"
        implementation "com.google.guava:guava:$guavaVersion"
        implementation "com.google.protobuf:protobuf-java:$protobufVersion"
        implementation "com.google.protobuf:protobuf-java-util:$protobufVersion"
        implementation "jakarta.xml.bind:jakarta.xml.bind-api:4.0.1"
        implementation "org.glassfish.jaxb:jaxb-runtime:4.0.4"
        implementation "jakarta.annotation:jakarta.annotation-api:2.1.1"
        implementation "net.java.dev.jna:jna:5.8.0"
        implementation "net.sourceforge.argparse4j:argparse4j:0.8.1"
        implementation "org.codehaus.janino:janino:3.0.12"
        implementation "org.slf4j:slf4j-api:$slf4jVersion"
        implementation "org.slf4j:jul-to-slf4j:$slf4jVersion"

        annotationProcessor "com.google.dagger:dagger-compiler:$daggerVersion"

        testImplementation "com.google.dagger:dagger:$daggerVersion"
        testImplementation "org.junit.jupiter:junit-jupiter-api:$jupiterVersion"
        testImplementation "org.junit.jupiter:junit-jupiter-engine:$jupiterVersion"

        testAnnotationProcessor "com.google.dagger:dagger-compiler:$daggerVersion"
    }

    test {
        maxHeapSize = "2048m"

        jvmArgs([
            "-Dlogback.configurationFile=$sourceRoot/toolbelt/src/main/resources/logback-test.xml"
        ])

        systemProperty "java.util.logging.config.file", "$sourceRoot/toolbelt/src/main/resources/logging-test.properties"
        useJUnitPlatform()
        dependsOn cleanTest
        testLogging {
            showStandardStreams = true
        }
    }
}

task downloadModels(type: Exec) {
    inputs.file "bin/download-models.py"
    commandLine "./bin/download-models.py"
}

task packageJdk(type: Exec) {
    inputs.file "bin/build-jdk.py"
    outputs.file "build/distributions/jdk.tar.gz"
    commandLine "./bin/build-jdk.py"
}

task createPackages {
    dependsOn ":packageJdk"
    dependsOn ":code-engine:distTar"
    dependsOn ":code-engine:packageModels"
    dependsOn ":core:distTar"
    dependsOn ":speech-engine:distTar"
    dependsOn ":speech-engine:packageModels"
}
